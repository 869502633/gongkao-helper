<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="50%" style="stop-color:#2c5282"/>
      <stop offset="100%" style="stop-color:#2b6cb0"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#edf2f7"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e"/>
      <stop offset="100%" style="stop-color:#c53030"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)"/>
  
  <!-- Book pages (left) -->
  <path d="M128 160 L248 148 L248 340 L128 352 Z" fill="url(#bookGrad)"/>
  <!-- Book pages (right) -->
  <path d="M384 160 L264 148 L264 340 L384 352 Z" fill="url(#bookGrad)"/>
  <!-- Book spine shadow -->
  <rect x="248" y="148" width="16" height="192" fill="#cbd5e0" opacity="0.5"/>
  
  <!-- Book lines (left page) -->
  <line x1="148" y1="180" x2="232" y2="172" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="200" x2="232" y2="192" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="220" x2="220" y2="212" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Book lines (right page) -->
  <line x1="280" y1="172" x2="364" y2="180" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="192" x2="364" y2="200" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="212" x2="352" y2="220" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Red bookmark ribbon -->
  <path d="M310 148 L350 148 L350 270 L330 252 L310 270 Z" fill="url(#ribbonGrad)"/>
  
  <!-- Checkmark circle (bottom right) -->
  <circle cx="380" cy="380" r="52" fill="#2f855a"/>
  <path d="M360 380 L374 394 L400 368" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Subtle inner glow -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
</svg>
